<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>KadduDesk</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  #shell { display: flex; height: 100%; }
  #side { width: 220px; flex: 0 0 auto; background: #12141a; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: calc(14px + var(--safe-t)) 10px 14px; gap: 4px; }
  #side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  #side .brand img { width: 36px; height: 36px; border-radius: 10px; }
  #side .brand b { font-size: 17px; display: block; } #side .brand span { color: var(--muted); font-size: 12px; }
  .tab { display: flex; align-items: center; gap: 12px; background: none; border: 0; border-radius: 11px; padding: 11px 12px; color: var(--muted); font-weight: 600; text-align: left; font-size: 14.5px; }
  .tab svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .tab.on { background: rgba(255,138,42,.14); color: var(--text); }
  .tab:hover { background: #1a1d25; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #view { flex: 1; overflow: auto; padding: calc(18px + var(--safe-t)) 22px calc(24px + var(--safe-b)); }
  #view.flush { padding: var(--safe-t) 0 0; overflow: hidden; }
  #view.flush iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  h1.pg { font-size: 22px; margin: 0 0 4px; } .pgsub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { display: flex; align-items: center; gap: 6px; background: #1c1f27; border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
  .chip svg { width: 16px; height: 16px; } .chip .n { font-size: 11.5px; opacity: .7; }
  .chip.on { color: var(--text); border-color: var(--accent); background: rgba(255,138,42,.13); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; } .toolbar input { flex: 1; min-width: 180px; }
  h2.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 18px 2px 10px; display: flex; align-items: center; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .dev { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .dev.off { opacity: .6; }
  .dev .top { display: flex; gap: 12px; align-items: center; }
  .osic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; position: relative; flex: 0 0 auto; }
  .osic svg { width: 24px; height: 24px; }
  .osic.Windows { background: #10324f; color: #5cb8ff; } .osic.Linux { background: #3b3214; color: #ffd24a; } .osic.Android { background: #12361f; color: #4fdc7c; } .osic.hub { background: #3a2412; color: var(--accent); } .osic.other { background: #232733; color: #ccc; }
  .osic i { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--panel-solid); background: #555; }
  .osic i.on { background: var(--ok); }
  .dev .meta { min-width: 0; flex: 1; } .dev b { display: block; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: #232733; border: 1px solid var(--line); color: var(--muted); margin-right: 4px; }
  .tag.net { color: #8fd3ff; } .tag.wifi { color: var(--ok); }
  .acts { display: flex; gap: 6px; } .acts .btn { flex: 1; padding: 8px; font-size: 13.5px; } .acts .more { flex: 0 0 auto; width: 38px; }
  .empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 16px; grid-column: 1 / -1; line-height: 1.7; font-size: 14px; }
  .panel { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; max-width: 760px; }
  .panel h3 { margin: 0 0 8px; font-size: 16px; }
  .big-toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .switch { position: relative; width: 50px; height: 28px; flex: 0 0 auto; } .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #2a2f3b; border-radius: 99px; transition: .15s; cursor: pointer; }
  .switch span:before { content: ''; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--accent); } .switch input:checked + span:before { transform: translateX(22px); }
  .state { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: #0c0e12; margin: 12px 0; font-size: 14px; }
  .state .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; flex: 0 0 auto; } .state .dot.ok { background: var(--ok); } .state .dot.warn { background: #ffcc4d; }
  .steps { margin: 8px 0 0; padding-left: 20px; line-height: 1.75; color: #d6d9e0; font-size: 14.5px; }
  .steps li { margin: 3px 0; }
  .guide details { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; max-width: 820px; }
  .guide summary { cursor: pointer; padding: 15px 18px; font-weight: 700; font-size: 15.5px; list-style: none; display: flex; gap: 12px; align-items: center; }
  .guide summary::-webkit-details-marker { display: none; }
  .guide summary .ico { font-size: 20px; } .guide summary .chev { margin-left: auto; color: var(--muted); transition: transform .15s; }
  .guide details[open] summary .chev { transform: rotate(90deg); }
  .guide .body { padding: 0 18px 16px 18px; } .guide .body p { color: #cfd3db; line-height: 1.6; margin: 6px 0; font-size: 14.5px; }
  .guide b.ui { color: #ffd2ad; } .guide .note { background: #0c0e12; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); margin-top: 8px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .modal .card { text-align: left; width: min(440px, 100%); }
  .fpbox { font: 600 15px/1.6 ui-monospace, Consolas, monospace; background: #0c0e12; border-radius: 10px; padding: 10px 12px; letter-spacing: .06em; word-break: break-all; margin: 10px 0; }
  .warnbox { background: rgba(255,90,95,.12); border: 1px solid rgba(255,90,95,.4); border-radius: 12px; padding: 12px; color: #ffc2c4; margin: 10px 0; font-size: 14px; }
  .menu { position: fixed; z-index: 60; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 6px; min-width: 170px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 8px; font-size: 14px; }
  .menu button:hover { background: #232733; } .menu .danger { color: #ff9a9d; }
  /* phones: bottom tab bar */
  @media (max-width: 760px) {
    #shell { flex-direction: column-reverse; }
    #side { width: auto; flex-direction: row; border-right: 0; border-top: 1px solid var(--line); padding: 4px 4px calc(4px + var(--safe-b)); justify-content: space-around; }
    #side .brand { display: none; }
    .tab { flex-direction: column; gap: 3px; padding: 7px 4px; font-size: 11px; flex: 1; align-items: center; }
    #view { padding: calc(14px + var(--safe-t)) 14px 18px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="shell">
  <nav id="side">
    <div class="brand"><img src="icon.png" alt=""><div><b>KadduDesk</b><span id="meName">…</span></div></div>
    <button class="tab" data-tab="devices"></button>
    <button class="tab" data-tab="anywhere"></button>
    <button class="tab" data-tab="local"></button>
    <button class="tab" data-tab="guide"></button>
  </nav>
  <main id="main"><div id="view"></div></main>
</div>
<div id="toast" hidden></div>
<script src="bridge.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
</body>
</html>
